<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elitecraft</title>
<style>
  :root { --gold: #f2c230; --navy: #0b1d3a; --red: #c8102e; --panel: #15161c; --panel2: #1f2129; --line: #3a3d4a; --txt: #e9e6dc; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--txt); font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; user-select: none; }
  canvas#game { position: fixed; inset: 0; display: block; }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- HUD ---------- */
  #top { position: fixed; top: 0; left: 0; right: 0; height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 10px;
    background: linear-gradient(#262833, #16171d); border-bottom: 2px solid #4a4434; z-index: 5; font-size: 14px; }
  #facLogo { width: 28px; height: 30px; } #facLogo svg { width: 100%; height: 100%; }
  #top > * { white-space: nowrap; flex: none; }
  @media (max-width: 860px) { #top { gap: 5px; padding: 0 5px; font-size: 12px; } .stat { padding: 3px 6px; } #top button { padding: 4px 6px; } }
  .stat { display: flex; align-items: center; gap: 6px; padding: 3px 10px; background: rgba(0,0,0,.35); border: 1px solid #3c3a33; border-radius: 4px; }
  .stat b { color: #fff; min-width: 24px; } .stat small { color: #8fe08f; }
  #idleBtn { cursor: pointer; } #idleBtn:hover { border-color: var(--gold); }
  .spacer { flex: 1; }
  #top button { background: #2c2f3a; color: var(--txt); border: 1px solid #4a4d5a; border-radius: 4px; padding: 4px 10px; font-size: 13px; }
  #top button:hover { border-color: var(--gold); }
  .musicBtn.mute { opacity: .4; text-decoration: line-through; }
  .pill { padding: 2px 9px; border-radius: 10px; background: rgba(255,255,255,.08); font-size: 13px; }
  .pill.gold { background: rgba(242,194,48,.18); color: #ffe68a; } .pill.red { background: rgba(255,90,40,.22); color: #ffb08a; }

  #msgs { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); z-index: 6; text-align: center; pointer-events: none; }
  .msg { font-size: 15px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 2px #000; margin: 3px 0; transition: opacity .6s; color: #fff; }

  #panel { position: fixed; left: 0; right: 0; bottom: 0; height: 196px; display: flex; gap: 8px; padding: 6px 8px;
    background: linear-gradient(#24262f, #121318); border-top: 3px solid #5a5240; z-index: 5; }
  #mmWrap { width: 188px; height: 184px; border: 2px solid #4a4434; background: #000; flex: none; }
  #minimap { display: block; cursor: pointer; }
  #infoWrap { flex: 1; display: flex; gap: 10px; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 6px; padding: 8px; min-width: 0; }
  #portrait { width: 120px; height: 120px; border: 2px solid #6a5f40; border-radius: 6px; flex: none; }
  #info { flex: 1; min-width: 0; overflow: hidden; font-size: 13px; }
  .i-name { font-size: 18px; font-weight: bold; color: #fff; } .i-name small { font-size: 11px; padding: 1px 6px; border-radius: 8px; margin-left: 6px; vertical-align: middle; }
  small.own { background: #1d5a7a; } small.foe { background: #7a1d1d; } small.neu { background: #5a5a1d; }
  .i-role { color: var(--gold); font-size: 12px; margin-bottom: 4px; }
  .i-tip { color: #aab; margin-top: 8px; font-size: 13px; max-width: 520px; }
  .i-status { margin-top: 5px; color: #cfd6e0; font-size: 12px; line-height: 1.45; } .i-status .desc { color: #9aa0ad; }
  .bar { position: relative; height: 15px; background: #2a2a2a; border: 1px solid #000; border-radius: 3px; margin: 3px 0; max-width: 420px; overflow: hidden; }
  .bar > div { height: 100%; } .bar span { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 14px; color: #fff; text-shadow: 0 0 2px #000; }
  .bar.hp.g > div { background: linear-gradient(#5ff06a, #2a9a34); } .bar.hp.y > div { background: linear-gradient(#ffe066, #c99a10); } .bar.hp.r > div { background: linear-gradient(#ff6a6a, #a81c1c); }
  .bar.en > div { background: linear-gradient(#d9a0ff, #7a3ab8); } .bar.pr > div { background: linear-gradient(#ffe066, #c99a10); } .bar.rice > div { background: linear-gradient(#bfe880, #6a9a30); }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; }
  .st i { font-style: normal; color: #8a90a0; }
  .queue { display: flex; gap: 4px; margin-top: 6px; }
  .qi { position: relative; width: 40px; height: 40px; border: 1px solid #6a5f40; background: #000; border-radius: 4px; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .qi img { width: 38px; height: 38px; } .qi .ic { font-size: 22px; } .qi:hover { border-color: #ff6060; }
  .qp { position: absolute; left: 0; bottom: 0; height: 4px; background: #7fd3ff; }
  .grid { display: flex; flex-wrap: wrap; gap: 3px; }
  .gi { width: 38px; height: 38px; border: 2px solid; border-radius: 4px; cursor: pointer; overflow: hidden; background: #000; }
  .gi img { width: 34px; height: 34px; display: block; } .gi.act { box-shadow: 0 0 0 2px #fff; } .gi.more { display: flex; align-items: center; justify-content: center; border-color: #555; font-size: 12px; }

  #cmd { width: 272px; flex: none; display: grid; grid-template-columns: repeat(4, 62px); grid-template-rows: repeat(3, 56px); gap: 5px; align-content: center; }
  .cb { position: relative; background: linear-gradient(#3a3d4a, #23252e); border: 2px solid #5a5240; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }
  .cb:hover { border-color: var(--gold); filter: brightness(1.2); }
  .cb.empty { background: rgba(0,0,0,.25); border-color: #2a2b32; cursor: default; filter: none; }
  .cb.off { filter: grayscale(1) brightness(.55); } .cb.poor .cost { color: #ff7070; }
  .cb.active { box-shadow: 0 0 10px 2px #ffe68a inset; }
  .cb img { width: 44px; height: 44px; } .cb .ic { font-size: 26px; }
  .cb .hk { position: absolute; top: 1px; left: 3px; font-size: 11px; font-weight: bold; color: var(--gold); text-shadow: 0 0 2px #000; }
  .cb .cost { position: absolute; bottom: 0; right: 3px; font-size: 10px; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
  .cdov { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); }
  #tooltip { position: fixed; display: none; width: 290px; background: rgba(12,13,18,.97); border: 1px solid #8a7a50; border-radius: 6px; padding: 8px 10px; z-index: 20; font-size: 12px; pointer-events: none; }
  .tt-h { font-weight: bold; color: #fff; font-size: 14px; } .tt-k { color: var(--gold); } .tt-c { color: #ffe68a; margin: 3px 0; } .tt-d { color: #c8ccd6; line-height: 1.4; } .tt-r { color: #ff8080; margin-top: 4px; }

  /* ---------- overlay / menus ---------- */
  #overlay { position: fixed; inset: 0; z-index: 30; overflow-y: auto; background: radial-gradient(ellipse at 30% 20%, #1d3c8f55, transparent 60%), radial-gradient(ellipse at 70% 80%, #c8102e55, transparent 60%), #0c0d12f2; }
  .menu, .codex, .help, .pause, .end { max-width: 1180px; margin: 0 auto; padding: 24px 20px 40px; }
  .title-row { display: flex; align-items: center; justify-content: center; gap: 26px; }
  .t-logo { width: 130px; height: 143px; filter: drop-shadow(0 6px 12px #000); } .t-logo svg { width: 100%; height: 100%; }
  .title { text-align: center; }
  h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 64px; margin: 0; letter-spacing: 6px; color: var(--gold); text-shadow: 0 3px 0 #6a4a10, 0 0 30px #f2c23066; }
  .subtitle { font-size: 18px; letter-spacing: 4px; text-transform: uppercase; color: #ddd; }
  .vs { margin-top: 6px; font-size: 15px; color: #aab; } .vs span { color: #ff6060; font-weight: bold; margin: 0 6px; }
  .pick { text-align: center; margin: 22px 0 10px; color: #aab; text-transform: uppercase; letter-spacing: 3px; font-size: 13px; }
  .facs { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .fac { display: flex; gap: 14px; padding: 16px; border-radius: 12px; cursor: pointer; border: 3px solid transparent; background: rgba(255,255,255,.04); transition: transform .15s, border-color .15s; }
  .fac:hover { transform: translateY(-2px); }
  .fac.meth { background: linear-gradient(135deg, #1d3c8f55, #0b1d3a88); } .fac.hwa { background: linear-gradient(135deg, #c8102e55, #5a0a1488); }
  .fac.on.meth { border-color: var(--gold); box-shadow: 0 0 24px #f2c23055; } .fac.on.hwa { border-color: #ffd000; box-shadow: 0 0 24px #ff300055; }
  .fac-logo { width: 110px; flex: none; } .fac-logo svg { width: 110px; height: 121px; }
  .fac h2 { margin: 0; font-family: Georgia, serif; color: #fff; } .fac-sub { color: var(--gold); font-size: 13px; margin-bottom: 6px; }
  .fac p { margin: 6px 0; font-size: 13px; line-height: 1.45; color: #d5d8e0; } .mech { color: #ffe9b0 !important; }
  .fac-units { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; } .fac-units img { width: 46px; height: 46px; border-radius: 6px; border: 1px solid #ffffff33; }
  .row { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .lbl { color: #aab; }
  .diff, .tab { background: #23252e; color: #ddd; border: 2px solid #44475a; border-radius: 6px; padding: 7px 16px; font-size: 14px; }
  .diff.on, .tab.on { border-color: var(--gold); color: #fff; background: #3a3420; }
  .big { background: linear-gradient(#f7d25a, #c9960f); color: #2a1a00; border: 2px solid #fff3c0; border-radius: 8px; padding: 12px 30px; font-size: 19px; font-weight: bold; box-shadow: 0 4px 0 #6a4a10; }
  .big:hover { filter: brightness(1.1); }
  .mid { background: #2a2d38; color: #eee; border: 2px solid #5a5240; border-radius: 8px; padding: 10px 18px; font-size: 15px; }
  .mid:hover { border-color: var(--gold); }
  .fine { text-align: center; color: #667; font-size: 12px; margin-top: 26px; }

  .cx-head { display: flex; gap: 16px; align-items: center; } .cx-tabs { display: flex; gap: 8px; }
  .cx-lore { display: flex; gap: 18px; align-items: center; margin: 18px 0; padding: 14px; background: rgba(255,255,255,.04); border-radius: 10px; }
  .cx-logo svg { width: 120px; height: 132px; } .cx-lore h2 { margin: 0 0 6px; font-family: Georgia, serif; } .cx-lore p { margin: 4px 0; line-height: 1.5; font-size: 14px; }
  h3 { font-family: Georgia, serif; color: var(--gold); border-bottom: 1px solid #44402f; padding-bottom: 4px; margin-top: 26px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .dcard { border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; border: 3px solid; box-shadow: 0 6px 16px #000a; }
  .dcard.meth { background: linear-gradient(170deg, #22408f, #0b1d3a 60%); border-color: #d9b44a; }
  .dcard.hwa { background: linear-gradient(170deg, #b0182b, #3a0710 60%); border-color: #f5d000; }
  .dc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .dc-name { font-weight: bold; font-family: Georgia, serif; font-size: 16px; color: #fff; } .dc-role { font-size: 11px; color: #ffe68a; text-transform: uppercase; letter-spacing: 1px; text-align: right; }
  .dc-art { border-radius: 8px; overflow: hidden; border: 2px solid #ffffff40; background: #000; } .dc-art img { width: 100%; display: block; image-rendering: auto; }
  .dc-stats { display: flex; flex-wrap: wrap; gap: 4px; } .dc-stats span { background: rgba(0,0,0,.4); border-radius: 10px; padding: 2px 7px; font-size: 12px; }
  .dc-desc { font-size: 12px; line-height: 1.45; color: #e2e4ea; } .dc-x { font-size: 11.5px; line-height: 1.4; color: #c8d0e0; background: rgba(0,0,0,.25); padding: 5px 7px; border-radius: 6px; } .dc-x.req { color: #ffd0a0; }
  .dc-quote { font-style: italic; color: #ffe9b0; font-size: 12.5px; text-align: center; margin-top: auto; }
  .tree { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 8px 0 14px; }
  .tier { display: flex; flex-direction: column; gap: 6px; min-width: 210px; } .tier-n { font-size: 11px; color: #889; text-transform: uppercase; letter-spacing: 2px; }
  .node { display: flex; gap: 8px; align-items: center; background: rgba(255,255,255,.05); border: 1px solid #44475a; border-radius: 8px; padding: 5px; }
  .node img { width: 54px; height: 54px; border-radius: 6px; } .node b { font-size: 13px; display: block; } .node small { display: block; font-size: 11px; color: #9aa0b0; }
  .arrow { color: var(--gold); font-size: 22px; }
  .research { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .rs { background: rgba(255,255,255,.05); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.4; } .rs small { color: #aab; }
  .help { max-width: 820px; } .help table { border-collapse: collapse; width: 100%; } .help td { padding: 5px 8px; border-bottom: 1px solid #333; font-size: 14px; } .help td:first-child { color: var(--gold); white-space: nowrap; }
  .help li { margin: 5px 0; line-height: 1.45; }
  .pause { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 18vh; } .pause h2 { font-family: Georgia, serif; font-size: 40px; margin: 0 0 10px; color: var(--gold); }
  .pause button { width: 240px; }
  .end { text-align: center; padding-top: 6vh; } .end-logo svg { width: 150px; height: 165px; }
  .end.win h1 { color: var(--gold); } .end.lose h1 { color: #ff5050; text-shadow: 0 3px 0 #500; }
  .end p { font-size: 17px; color: #ddd; }
  table.stats { margin: 18px auto; border-collapse: collapse; } table.stats td, table.stats th { padding: 5px 18px; border-bottom: 1px solid #333; } table.stats th { color: var(--gold); }
  @media (max-width: 900px) { .facs { grid-template-columns: 1fr; } h1 { font-size: 40px; } .t-logo { width: 80px; height: 88px; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
  <div id="top">
    <div id="facLogo"></div>
    <div class="stat"><span id="resIcon">💰</span><b id="res">0</b><small id="income"></small></div>
    <div class="stat">👥 <b id="supply">0/0</b></div>
    <div class="stat" id="idleBtn" title="Select idle worker"><span id="idleIcon">🧹</span> Idle <b id="idle">0</b></div>
    <div id="status"></div>
    <div class="spacer"></div>
    <div class="stat">⏱ <b id="clock">00:00</b></div>
    <button id="speedBtn" title="Game speed">1×</button>
    <button id="musicBtn" class="musicBtn" title="Music">🎵</button>
    <button id="muteBtn" title="Sound effects">🔊</button>
    <button id="menuBtn">☰ Menu</button>
  </div>
  <div id="msgs"></div>
  <div id="panel">
    <div id="mmWrap"><canvas id="minimap" width="184" height="184"></canvas></div>
    <div id="infoWrap"><canvas id="portrait" width="120" height="120"></canvas><div id="info"></div></div>
    <div id="cmd"></div>
  </div>
</div>
<div id="tooltip"></div>
<div id="overlay"></div>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
<script src="js/music.js"></script>
<script src="js/ui.js"></script>
<script src="js/ai.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
